name: Build APK

# 只手动触发：仓库 → Actions → Build APK → Run workflow
on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 构建类型（debug / release；release 用 debug keystore 签名，可直接安装）
        required: true
        default: debug
        type: choice
        options:
          - debug
          - release
      clean:
        description: 构建前先 clean
        required: false
        default: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build
        run: |
          if [ "${{ inputs.clean }}" = "true" ]; then ./gradlew clean; fi
          if [ "${{ inputs.build_type }}" = "release" ]; then
            ./gradlew :app:assembleRelease :plugin-sample:assembleRelease
          else
            ./gradlew :app:assembleDebug :plugin-sample:assembleDebug
          fi

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ inputs.build_type }}
          path: '**/build/reports/**'
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: DynHost-${{ inputs.build_type }}
          path: |
            app/build/outputs/apk/${{ inputs.build_type }}/*.apk
            plugin-sample/build/outputs/apk/${{ inputs.build_type }}/*.apk
          if-no-files-found: error
          retention-days: 30
